# Veröffentlicht den Inhalt des Repos als GitHub Pages.
#
# enablement: true schaltet Pages beim ersten Lauf selbst ein — der Weg über
# Settings → Pages entfällt damit. Voraussetzung ist ein öffentliches Repo
# (oder GitHub Pro), sonst verweigert die API den Zugriff.
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
